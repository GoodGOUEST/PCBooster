  <text x='56' y='762' font-size='13' font-weight='700' fill='#a50e0e'>四条写路径共用同一道闸门（改执行层必读）</text>
  <text x='56' y='784' font-size='12' fill='#3c4043'>优先级写入 · 亲和性绑定 · Job 限速 · 工作集 Trim  →  ProcessMatcher.IsSystemProcess / IsProtected / ProcessSafeHelper.HasVisibleWindow</text>
  <text x='56' y='804' font-size='12' fill='#3c4043'>系统进程 · 显卡链路 · 存储缓存链路 · 安全/更新链路 · 反作弊 · 有可见窗口的程序：一律不写</text>
