name: CLA Assistant

# 首次提交 PR 时自动要求签署 CLA，签过的人记录在 cla-signatures 分支的 cla.json 里。
# 安装/配置步骤见 CONTRIBUTING.md「许可与 CLA」一节。

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # 只在「PR 事件」或「评论里出现签署语句/recheck」时运行，避免每条评论都触发
    if: >
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       (contains(github.event.comment.body, 'I have read the CLA Document') ||
        contains(github.event.comment.body, 'recheck')))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 需要一个 fine-grained PAT（仅 contents: write），存为仓库 secret：CLA_PAT
          # 原因：来自 fork 的 PR 无法用 GITHUB_TOKEN 写入签名文件/回评
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PAT }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/${{ github.repository }}/blob/main/CLA-Individual.md'
          branch: 'cla-signatures'
          # ⬇︎ 把 <你的GitHub用户名> 换成你自己的账号，否则你自己的 PR 也会被要求签 CLA
          allowlist: 'bot*,dependabot[bot],GoodGOUEST'
          create-file-commit-message: 'chore: 初始化 CLA 签名库'
          signed-commit-message: 'chore: $contributorName 在 #$pullRequestNo 签署了 CLA'
          custom-notsigned-prcomment: |
            感谢 PR！本项目需要先签署 [CLA](https://github.com/${{ github.repository }}/blob/main/CLA-Individual.md)
            （**不是版权转让**：你保留著作权，只是允许项目在 GPL 之外也能以其他许可、含商业许可分发你的贡献）。

            请在下方**评论**下面这一行完成签署：
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: '✅ 所有贡献者均已签署 CLA，可以合并。'
          lock-pullrequest-aftermerge: false
