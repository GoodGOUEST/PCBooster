name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PCBooster.csproj

      - name: Build (warnings are fatal)
        run: dotnet build PCBooster.csproj -c Release --no-restore -warnaserror

      - name: Audit (layering / cycles / dead code)
        shell: pwsh
        run: |
          node scripts/parse_cs3.mjs
          Start-Sleep -Seconds 2
          node scripts/audit_report.mjs
          Start-Sleep -Seconds 3
          Get-Content audit_report.txt

      - name: Publish single file
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish PCBooster.csproj -c Release -p:PublishProfile=SingleFileX64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCBooster-${{ github.ref_name }}
          path: out/sc-x64/PCBooster.exe
          if-no-files-found: error
